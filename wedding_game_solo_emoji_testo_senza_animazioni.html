<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Diana & Salvatore - Wedding Game</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --terracotta:#C05A44;
  --terracotta-dark:#8E3E2F;
  --cream:#FAF5F2;
}
body{
  font-family:'Playfair Display',serif;
  background:var(--cream);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  margin:0;
}
.header{text-align:center;margin-bottom:30px}
.names{font-family:'Great Vibes',cursive;font-size:3.6rem;color:var(--terracotta);margin:0}
.date{letter-spacing:4px;color:var(--terracotta-dark);font-weight:bold}
.instructions{font-style:italic;margin-bottom:25px;color:var(--terracotta-dark)}
.scratch-container{
  position:relative;
  width:320px;height:180px;
  border:10px solid #fff;
  box-shadow:0 15px 40px rgba(192,90,68,.2);
  border-radius:20px;
  background:#fff;
}
#prize{
  position:absolute;
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  text-align:center;
  font-size:1.3rem;
  font-weight:bold;
  color:var(--terracotta-dark);
  padding:25px;
  box-sizing:border-box;
}
#scratch-canvas{position:absolute;top:0;left:0;touch-action:none;border-radius:10px}
.footer{margin-top:50px;font-size:.75rem;color:var(--terracotta-dark);opacity:.6}
</style>
</head>
<body>
<div class="header">
  <h1 class="names">Diana & Salvatore</h1>
  <div class="date">14 Giugno 2026</div>
</div>
<p class="instructions">Sfiora lo schermo per scoprire la sorpresa...</p>
<div class="scratch-container">
  <div id="prize"></div>
  <canvas id="scratch-canvas" width="320" height="180"></canvas>
</div>
<div class="footer">Wedding Day ✨ Love & Luck</div>

<script>
const canvas=document.getElementById('scratch-canvas');
const ctx=canvas.getContext('2d');
const prizeDiv=document.getElementById('prize');

const premi=[
  "Dedica una canzone allo sposo!",
  "Dedica una canzone alla sposa!",
  "Fai un brindisi agli sposi!",
  "Scatta un selfie con tutto il tavolo!",
  "Scatta un selfie con la sposa!",
  "Scatta un selfie con lo sposo!",
  "Scatta una Polaroid con gli sposi!",
  "Lascia una dedica sull'album dei ricordi!",
  "Mi dispiace, hai perso!",
  "Ritenta, sarai più fortunato!",
  "Peccato, sarà per la prossima volta!"
];

const premio=premi[Math.floor(Math.random()*premi.length)];
prizeDiv.textContent=premio;

// Strato gratta e vinci
const g=ctx.createLinearGradient(0,0,320,180);
g.addColorStop(0,'#C05A44');
g.addColorStop(.5,'#E2725B');
g.addColorStop(1,'#8E3E2F');
ctx.fillStyle=g;
ctx.fillRect(0,0,320,180);
ctx.fillStyle='#fff';
ctx.font='bold 16px Arial';
ctx.textAlign='center';
ctx.fillText('GRATTA QUI ✨',160,95);

let drawing=false;
function scratch(e){
  if(!drawing) return;
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX||(e.touches&&e.touches[0].clientX))-r.left;
  const y=(e.clientY||(e.touches&&e.touches[0].clientY))-r.top;
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath();
  ctx.arc(x,y,26,0,Math.PI*2);
  ctx.fill();
}
canvas.addEventListener('mousedown',()=>drawing=true);
canvas.addEventListener('mouseup',()=>drawing=false);
canvas.addEventListener('mousemove',scratch);
canvas.addEventListener('touchstart',e=>{drawing=true;scratch(e)});
canvas.addEventListener('touchend',()=>drawing=false);
canvas.addEventListener('touchmove',e=>{e.preventDefault();scratch(e)});
</script>
</body>
</html>
